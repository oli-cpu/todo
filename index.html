<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>todo.studer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg: #0A0E13;
    --surface: #10151C;
    --surface-2: #161D26;
    --ink: #D6DEE5;
    --ink-soft: #6E7E8C;
    --accent: #3EE888;
    --accent-2: #38C7FF;
    --warn: #FFB454;
    --line: rgba(255,255,255,0.09);
    --done: #4A5561;
    --danger: #FF5F58;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(62,232,136,0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(56,199,255,0.05), transparent 40%),
      var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }

  .page{
    max-width:760px;
    margin:0 auto;
    padding:48px 20px 80px;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--accent);
    padding-bottom:16px;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
    box-shadow: 0 1px 0 rgba(62,232,136,0.25);
  }

  .brand-tag{
    font-size:11px;
    color:var(--accent);
    letter-spacing:.12em;
    margin-bottom:6px;
  }
  .brand-tag::before{ content:"● "; }

  h1{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
    color:var(--ink);
  }
  h1::after{
    content:"▌";
    color:var(--accent);
    animation:blink 1.1s steps(1) infinite;
    margin-left:2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .subtitle{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .subtitle::before{ content:"// "; color:var(--ink-soft); }

  .export-all{
    background:none;
    border:1px solid var(--accent-2);
    color:var(--accent-2);
    font-family:inherit;
    font-size:12px;
    letter-spacing:.04em;
    padding:9px 14px;
    border-radius:2px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, box-shadow .15s;
  }
  .export-all:hover{ background:var(--accent-2); color:#04141C; box-shadow:0 0 14px rgba(56,199,255,0.35); }
  .export-all:disabled{ opacity:.35; cursor:default; }
  .export-all:disabled:hover{ background:none; color:var(--accent-2); box-shadow:none; }

  .add-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:4px;
    padding:12px;
    margin-bottom:32px;
  }

  .add-row input[type="text"]{
    flex:1 1 200px;
  }
  .add-row input[type="date"]{ flex:0 0 150px; }
  .add-row input[type="time"]{ flex:0 0 110px; }

  input, textarea{
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:3px;
    padding:9px 10px;
    color-scheme: dark;
  }
  input::placeholder, textarea::placeholder{ color:var(--ink-soft); }
  input:focus, textarea:focus, button:focus{
    outline:1px solid var(--accent);
    outline-offset:1px;
    box-shadow:0 0 0 3px rgba(62,232,136,0.15);
  }

  textarea{
    width:100%;
    resize:vertical;
    min-height:36px;
    font-size:12px;
  }

  .desc-toggle{
    flex:1 1 100%;
  }
  .desc-toggle summary{
    font-size:11px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .desc-toggle summary::before{ content:"$ "; color:var(--accent); }
  .desc-toggle textarea{ margin-top:8px; }

  button.add-btn{
    background:var(--accent);
    color:#04150C;
    border:none;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    letter-spacing:.03em;
    padding:9px 18px;
    border-radius:3px;
    cursor:pointer;
    flex:0 0 auto;
    transition:box-shadow .15s, background .15s;
  }
  button.add-btn:hover{ background:#5CF7A0; box-shadow:0 0 16px rgba(62,232,136,0.45); }

  .list{
    border-top:1px solid var(--line);
  }

  .row{
    display:flex;
    gap:18px;
    padding:16px 4px;
    border-bottom:1px solid var(--line);
    align-items:flex-start;
  }

  .date-block{
    flex:0 0 56px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    line-height:1;
  }
  .date-block .day{
    font-size:24px;
    font-weight:700;
    color:var(--ink);
  }
  .date-block .month{
    font-size:10px;
    color:var(--ink-soft);
    letter-spacing:.05em;
    margin-top:5px;
    text-transform:uppercase;
  }
  .date-block .weekday{
    font-size:10px;
    color:var(--accent);
    margin-top:2px;
    text-transform:uppercase;
  }
  .date-block.no-date .day{ color: var(--ink-soft); font-size:18px; }

  .content{
    flex:1 1 auto;
    min-width:0;
  }
  .title-line{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .title{
    font-size:14px;
    font-weight:500;
    word-break:break-word;
  }
  .time-chip{
    font-size:11px;
    color:var(--warn);
    border:1px solid var(--warn);
    border-radius:2px;
    padding:1px 8px;
    white-space:nowrap;
  }
  .desc{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:6px;
    white-space:pre-wrap;
    word-break:break-word;
  }

  .row.done .title{ color:var(--done); text-decoration:line-through; }
  .row.done .desc{ color:var(--done); }
  .row.done .date-block .day, .row.done .date-block .month, .row.done .date-block .weekday{ color:var(--done); }

  .actions{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .icon-btn{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:3px;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    padding:0;
    transition:border-color .15s, color .15s, box-shadow .15s;
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent); box-shadow:0 0 10px rgba(62,232,136,0.25); }
  .icon-btn.done-btn.active{ background:var(--accent); border-color:var(--accent); color:#04150C; }
  .icon-btn.del-btn:hover{ border-color:var(--danger); color:var(--danger); box-shadow:0 0 10px rgba(255,95,88,0.25); }
  .icon-btn svg{ width:16px; height:16px; }

  .gcal-btn{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--accent-2);
    color:var(--accent-2);
    font-family:inherit;
    font-size:11px;
    font-weight:500;
    letter-spacing:.02em;
    padding:0 10px;
    height:32px;
    border-radius:3px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .15s, color .15s, box-shadow .15s;
  }
  .gcal-btn:hover{ background:var(--accent-2); color:#04141C; box-shadow:0 0 14px rgba(56,199,255,0.35); }
  .gcal-btn svg{ width:14px; height:14px; flex:0 0 auto; }

  .empty{
    padding:40px 4px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
  .empty::before{ content:"> "; color:var(--accent); }

  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--surface-2);
    border:1px solid var(--accent);
    color:var(--ink);
    font-family:inherit;
    font-size:12px;
    padding:10px 18px;
    border-radius:4px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    box-shadow:0 0 16px rgba(62,232,136,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:480px){
    .row{ gap:12px; flex-wrap:wrap; }
    .date-block{ flex-basis:44px; }
    .date-block .day{ font-size:22px; }
    .actions{ width:100%; justify-content:flex-start; margin-top:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div>
      <div class="brand-tag">SYSTEM ONLINE</div>
      <h1>todo.studer</h1>
      <div class="subtitle" id="subtitle">Aufgaben eintragen und direkt in den Kalender exportieren</div>
    </div>
    <button class="export-all" id="exportAllBtn" disabled>[ ALLE → ICS ]</button>
  </header>

  <div class="add-row" id="addForm">
    <input type="text" id="titleInput" placeholder="Was ist zu tun?">
    <input type="date" id="dateInput">
    <input type="time" id="timeInput">
    <button type="button" class="add-btn" id="addBtn">[ HINZUFÜGEN ]</button>
    <details class="desc-toggle">
      <summary>Beschreibung hinzufügen (optional)</summary>
      <textarea id="descInput" placeholder="Notizen, Ort, Details..."></textarea>
    </details>
  </div>

  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">Noch keine Aufgaben. Trag oben die erste ein.</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'todos';
let todos = [];

const listEl = document.getElementById('list');
const emptyMsg = document.getElementById('emptyMsg');
const exportAllBtn = document.getElementById('exportAllBtn');
const toastEl = document.getElementById('toast');

const WEEKDAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
}

async function loadTodos(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    todos = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    todos = [];
  }
  render();
}

async function saveTodos(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(todos), false);
  }catch(e){
    showToast('Speichern fehlgeschlagen');
  }
}

function uid(){
  return 't' + Date.now() + Math.random().toString(36).slice(2,7);
}

function pad(n){ return String(n).padStart(2,'0'); }

// Build a local Date from date (YYYY-MM-DD) + optional time (HH:MM)
function toLocalDate(dateStr, timeStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  if(timeStr){
    const [h,min] = timeStr.split(':').map(Number);
    return new Date(y, m-1, d, h, min, 0);
  }
  return new Date(y, m-1, d, 0, 0, 0);
}

function addDays(dateStr, n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+n);
  return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`;
}

function toUTCStamp(dt){
  return dt.getUTCFullYear() + pad(dt.getUTCMonth()+1) + pad(dt.getUTCDate()) + 'T' +
         pad(dt.getUTCHours()) + pad(dt.getUTCMinutes()) + pad(dt.getUTCSeconds()) + 'Z';
}

function plainDateStamp(dateStr){
  return dateStr.replaceAll('-','');
}

// ---- Google Calendar link ----
function googleCalendarUrl(todo){
  const base = 'https://calendar.google.com/calendar/render?action=TEMPLATE';
  const text = '&text=' + encodeURIComponent(todo.title);
  const details = todo.desc ? '&details=' + encodeURIComponent(todo.desc) : '';
  let dates;
  if(!todo.date){
    // no date at all: default to today, all day
    const today = new Date();
    const ds = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    dates = plainDateStamp(ds) + '/' + addDays(ds,1);
  } else if(todo.time){
    const start = toLocalDate(todo.date, todo.time);
    const end = new Date(start.getTime() + 60*60*1000);
    dates = toUTCStamp(start) + '/' + toUTCStamp(end);
  } else {
    dates = plainDateStamp(todo.date) + '/' + addDays(todo.date,1);
  }
  return base + text + '&dates=' + dates + details;
}

// ---- ICS ----
function escapeICS(text){
  return String(text||'')
    .replace(/\\/g,'\\\\')
    .replace(/;/g,'\\;')
    .replace(/,/g,'\\,')
    .replace(/\n/g,'\\n');
}

function icsEvent(todo){
  const now = toUTCStamp(new Date());
  let dtLines;
  if(!todo.date){
    const today = new Date();
    const ds = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    dtLines = `DTSTART;VALUE=DATE:${plainDateStamp(ds)}\r\nDTEND;VALUE=DATE:${addDays(ds,1)}`;
  } else if(todo.time){
    const start = toLocalDate(todo.date, todo.time);
    const end = new Date(start.getTime() + 60*60*1000);
    dtLines = `DTSTART:${toUTCStamp(start)}\r\nDTEND:${toUTCStamp(end)}`;
  } else {
    dtLines = `DTSTART;VALUE=DATE:${plainDateStamp(todo.date)}\r\nDTEND;VALUE=DATE:${addDays(todo.date,1)}`;
  }
  return [
    'BEGIN:VEVENT',
    `UID:${todo.id}@todo.studer`,
    `DTSTAMP:${now}`,
    dtLines,
    `SUMMARY:${escapeICS(todo.title)}`,
    todo.desc ? `DESCRIPTION:${escapeICS(todo.desc)}` : null,
    'END:VEVENT'
  ].filter(Boolean).join('\r\n');
}

function icsFile(events){
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//todo.studer//DE',
    'CALSCALE:GREGORIAN',
    ...events,
    'END:VCALENDAR'
  ].join('\r\n');
}

function downloadICS(content, filename){
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function safeFilename(str){
  return (str||'termin').toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-').slice(0,40) || 'termin';
}

// ---- Rendering ----
function formatDateBlock(todo){
  if(!todo.date){
    return `<div class="date-block no-date"><div class="day">—</div><div class="month">kein<br>Datum</div></div>`;
  }
  const [y,m,d] = todo.date.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `<div class="date-block">
    <div class="day">${pad(d)}</div>
    <div class="month">${MONTHS[m-1]}</div>
    <div class="weekday">${WEEKDAYS[dt.getDay()]}</div>
  </div>`;
}

function render(){
  todos.sort((a,b)=>{
    if(a.done !== b.done) return a.done ? 1 : -1;
    const da = a.date || '9999-99-99';
    const db = b.date || '9999-99-99';
    if(da !== db) return da < db ? -1 : 1;
    return (a.time||'').localeCompare(b.time||'');
  });

  listEl.innerHTML = '';
  emptyMsg.style.display = todos.length ? 'none' : 'block';
  exportAllBtn.disabled = todos.length === 0;

  for(const todo of todos){
    const row = document.createElement('div');
    row.className = 'row' + (todo.done ? ' done' : '');
    row.innerHTML = `
      ${formatDateBlock(todo)}
      <div class="content">
        <div class="title-line">
          <span class="title"></span>
          ${todo.time ? `<span class="time-chip">${todo.time}</span>` : (todo.date ? `<span class="time-chip">GANZTAG</span>` : '')}
        </div>
        ${todo.desc ? `<div class="desc"></div>` : ''}
      </div>
      <div class="actions">
        <button class="icon-btn done-btn ${todo.done?'active':''}" title="Erledigt umschalten" aria-label="Erledigt umschalten">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12l5 5 11-11"/></svg>
        </button>
        <button class="gcal-btn cal-btn" title="In Google Kalender hinzufügen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>GOOGLE_CAL</span>
        </button>
        <button class="icon-btn ics-btn" title="Als .ics herunterladen" aria-label="Als .ics herunterladen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        </button>
        <button class="icon-btn del-btn" title="Löschen" aria-label="Löschen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    `;
    row.querySelector('.title').textContent = todo.title;
    if(todo.desc) row.querySelector('.desc').textContent = todo.desc;

    row.querySelector('.done-btn').addEventListener('click', ()=> toggleDone(todo.id));
    row.querySelector('.cal-btn').addEventListener('click', ()=> {
      window.open(googleCalendarUrl(todo), '_blank');
    });
    row.querySelector('.ics-btn').addEventListener('click', ()=> {
      downloadICS(icsFile([icsEvent(todo)]), safeFilename(todo.title) + '.ics');
      showToast('.ics heruntergeladen');
    });
    row.querySelector('.del-btn').addEventListener('click', ()=> deleteTodo(todo.id));

    listEl.appendChild(row);
  }
}

function toggleDone(id){
  const t = todos.find(t=>t.id===id);
  if(t){ t.done = !t.done; saveTodos(); render(); }
}

function deleteTodo(id){
  todos = todos.filter(t=>t.id!==id);
  saveTodos();
  render();
}

function addTodo(){
  const titleEl = document.getElementById('titleInput');
  const title = titleEl.value.trim();
  if(!title){
    titleEl.focus();
    showToast('Bitte einen Titel eingeben');
    return;
  }
  const date = document.getElementById('dateInput').value;
  const time = document.getElementById('timeInput').value;
  const desc = document.getElementById('descInput').value.trim();

  todos.push({ id: uid(), title, date, time, desc, done:false });
  saveTodos();
  render();

  titleEl.value = '';
  document.getElementById('dateInput').value = '';
  document.getElementById('timeInput').value = '';
  document.getElementById('descInput').value = '';
  titleEl.focus();
}

document.getElementById('addBtn').addEventListener('click', addTodo);

document.getElementById('titleInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){
    e.preventDefault();
    addTodo();
  }
});

exportAllBtn.addEventListener('click', ()=>{
  if(!todos.length) return;
  downloadICS(icsFile(todos.map(icsEvent)), 'aufgaben.ics');
  showToast('Alle Aufgaben als .ics heruntergeladen');
});

loadTodos();
</script>

</body>
</html>
